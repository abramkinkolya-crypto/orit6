<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ОРИТ №6 · Пациенты</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f9;color:#24424e;font:14px Arial,sans-serif}header{background:white;border-bottom:1px solid #dce7ec;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:25px}a{color:#39716e;font-size:19px;font-weight:800;text-decoration:none;line-height:1.4}button{cursor:pointer;border:1px solid #dce7ec;background:white;border-radius:9px;padding:10px 13px;color:#587e8b;font:700 12px Arial}button:disabled{opacity:.4;cursor:not-allowed}main{padding:22px;max-width:1900px;margin:auto}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.ward{background:#e8eff3;border:1px solid #dbe6ec;border-radius:14px;padding:10px;min-width:0}.w5{background:#e5f3ee;border-color:#cde6dc}.wh{display:flex;gap:5px;align-items:center;white-space:nowrap;margin-bottom:13px;font-size:11px;min-width:0}.floor{color:#8397a1;font-size:10px}.wn{font-weight:800;flex-shrink:0}.doc{color:#558575;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:10px}.plus{padding:0;width:24px;height:24px;flex-shrink:0;font-size:21px;background:#f7fcfb;color:#248f80;border-color:#c9e1da}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.patient{height:65px;width:100%;min-width:0;text-align:left;padding:10px 8px;display:flex;flex-direction:column;justify-content:center;gap:8px;border-radius:11px}.patient:hover{border-color:#71bfb2;background:#f8fdfb}.line{display:flex;gap:4px;align-items:baseline;white-space:nowrap;min-width:0;width:100%}.number{font-size:10px;color:#98a5ae;font-weight:600}.person{font-size:13px;white-space:nowrap;min-width:0}.surname{font-weight:900;color:#132c37}.initials{font-size:.8em;color:#546e7a}.age{font-size:12px;color:#268d7d;font-weight:750}.free{background:#e3f8ea;border-color:#83d5a0}.free:hover{background:#d4f3df}.free-title{font-weight:800;color:#208647}.free-title:before{content:'●';font-size:9px;margin-right:5px}.total{font-size:12px;color:#8096a0;margin-bottom:17px}.total span{color:#229855;margin-left:18px}[hidden]{display:none!important}dialog{width:540px;max-width:96%;padding:25px;border:1px solid #d9e5e9;border-radius:16px;color:#24424e}dialog::backdrop{background:#173a4855}h2{font-size:21px;margin:0 0 20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:flex;flex-direction:column;gap:7px;font-size:12px;color:#708994}.wide{grid-column:1/-1}input,label select{width:100%;padding:11px;border:1px solid #d5e3e9;border-radius:8px;font:14px Arial;color:#24424e}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.red{background:#d94b4b;border-color:#d94b4b;color:white}.blue{background:#46a8e8;border-color:#46a8e8;color:white}.primary{background:#19aa9a;border-color:#19aa9a;color:white}.error{font-size:12px;color:#b45c42;margin-top:12px}.workspace{background:white;border:1px solid #dce7ec;border-radius:16px;padding:24px;max-width:950px;margin:auto}.workspace-head{display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:23px;margin:0}.rules{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}.rule{flex:1;min-width:220px;background:#edf6f3;border:1px solid #d8eae3;border-radius:12px;padding:15px;font-size:13px;color:#567d73}.rule strong{display:block;margin-bottom:6px}.toolbar{display:flex;gap:12px;align-items:center;margin:18px 0}.table-wrap{overflow:auto;max-height:55vh;border:1px solid #dce7ec;border-radius:12px}table{width:100%;border-spacing:0;table-layout:fixed;min-width:510px}td,th{border-bottom:1px solid #e3ecef;border-right:1px solid #e3ecef}thead th{position:sticky;top:0;background:#edf6f3;color:#42776e;text-align:left;padding:12px;font-size:13px}thead th:first-child{width:75px}thead small{display:block;font-size:10px;margin-top:5px;font-weight:500}tbody th{color:#7a919b;background:#f7fafb;font-size:12px}.today th{background:#d9eee5;color:#207e66}td{padding:0}td select{width:100%;padding:10px;border:0;background:white;color:#7f959f;font:600 13px Arial}td select.filled{background:#eef9f3;color:#2c6658}.status{font-size:12px;color:#298d7c}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #1aaa9a;outline-offset:2px}@media(max-width:1450px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}.person{font-size:15px}}@media(max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.w5{grid-column:1/-1}.w5 .cards{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:650px){header{align-items:flex-start;flex-direction:column;padding:14px}main{padding:18px 12px}.board{grid-template-columns:1fr}.w5{grid-column:auto}.w5 .cards{grid-template-columns:repeat(2,minmax(0,1fr))}.person{font-size:16px}.workspace{padding:15px}.workspace-head{align-items:flex-start;flex-direction:column}}</style></head><body><header><a href="https://demikhova.ru/filial-1/otdelenie-reanimatsii-i-intensivnoi-terapii-6" target="_blank" rel="noopener noreferrer">Отделение реанимации и интенсивной терапии для больных гнойной хирургии № 6</a><button onclick="page('schedule')">⚙ График врачей</button></header><main><section id="patients"><div class="total" id="total"></div><div class="board" id="board"></div></section><section id="schedule" hidden><div class="workspace"><div class="workspace-head"><h1>График врачей</h1><button onclick="page('patients')">← К пациентам</button></div><div class="rules"><div class="rule"><strong>Врач палаты №1</strong>Курирует палаты 1 и 5</div><div class="rule"><strong>Врач палаты №2</strong>Курирует палаты 2, 3 и 4</div></div><div class="toolbar"><button class="primary" onclick="saveSchedule()">Сохранить график</button><span class="status" id="status" role="status"></span></div><div class="table-wrap"><table><thead><tr><th>Дата</th><th>Палата №1<small>Курирует 1 и 5</small></th><th>Палата №2<small>Курирует 2, 3 и 4</small></th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><dialog id="editor"><form id="form"><h2 id="title"></h2><div class="fields"><label class="wide">Фамилия<input id="surname" required maxlength="50" autocomplete="off"></label><label>Инициалы<input id="initials" required maxlength="20" autocomplete="off"></label><label>Возраст<input id="age" type="number" min="0" max="120" step="1" required></label><label>Палата<select id="ward" onchange="bedLimit()"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Номер койки<input id="bed" type="number" min="1" step="1" required></label></div><div class="error" id="error" role="alert"></div><div class="actions"><button type="button" class="red" id="release" onclick="releaseBed()">Освободить койку</button><button type="button" class="blue" id="restore" onclick="restorePatient()">Вернуть пациента</button></div><div class="buttons"><button type="button" onclick="closeEditor()">Отмена</button><button type="submit" class="primary">Применить</button></div></form></dialog><script>'use strict';
const capacities={1:5,2:5,3:1,4:2,5:4};const doctors=['Абрамкин Н.А.','Исаев И.В.','Абдуллаева А.А.','Байрамуков У.А.','Магомедов О.С.','Нагацуева Д.А.','Скворцова Н.А.','Тимошенко Л.В.','Чернышева Е.С.','Катамадзе Л.','Алишихов А.М.','Тенов М.А.'];const slots=[];let editing=null;for(let w=1;w<=5;w++)for(let n=1;n<=capacities[w];n++)slots.push({id:slots.length+1,ward:w,bed:n,occupied:false,surname:'',initials:'',age:null,lastPatient:null});
const el=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function normalize(){for(let w=1;w<=5;w++){let a=slots.filter(s=>s.ward===w);if(a.every(s=>!s.occupied))a.sort((x,y)=>x.bed-y.bed).forEach((s,i)=>s.bed=i+1)}}function currentDoctors(){let r=el('rows').rows[new Date().getDate()-1];return r?[...r.querySelectorAll('select')].map(s=>s.value):['','']}
function render(){normalize();let docs=currentDoctors();el('board').innerHTML=[1,2,3,4,5].map(w=>{let doc=docs[w===1||w===5?0:1]||'не назначен';return `<section class="ward w${w}"><div class="wh"><span class="floor">${w===5?2:3}-й этаж</span><span>·</span><span class="wn">Палата №${w}</span><span>·</span><span class="doc" title="Врач: ${esc(doc)}">врач: ${esc(doc)}</span><button class="plus" onclick="openAdd(${w})" aria-label="Добавить пациента в палату ${w}">+</button></div><div class="cards">${slots.filter(s=>s.ward===w).sort((x,y)=>x.bed-y.bed).map(s=>s.occupied?`<button class="patient" onclick="openEdit(${s.id})" aria-label="Редактировать ${esc(s.surname)} ${esc(s.initials)}"><span class="line"><span class="number">${s.bed}</span><span class="person"><span class="surname">${esc(s.surname)}</span> <span class="initials">${esc(s.initials)}</span></span></span><span class="age">${s.age} лет</span></button>`:`<button class="patient free" onclick="openEdit(${s.id})" aria-label="Свободная койка ${s.bed}, палата ${w}"><span class="number">${s.bed}</span><span class="free-title">Свободна</span></button>`).join('')}</div></section>`}).join('');el('total').innerHTML='Пациентов: '+slots.filter(s=>s.occupied).length+'<span>Свободных коек: '+slots.filter(s=>!s.occupied).length+'</span>';requestAnimationFrame(fitNames)}function fitNames(){document.querySelectorAll('.person').forEach(e=>{e.style.fontSize='';let n=parseFloat(getComputedStyle(e).fontSize);while(e.scrollWidth>e.clientWidth&&n>10){n-=.25;e.style.fontSize=n+'px'}})}
function bedLimit(){el('bed').max=capacities[Number(el('ward').value)]}function openEdit(id){let s=slots.find(s=>s.id===id);editing=id;el('title').textContent=s.occupied?'Редактирование пациента':'Свободная койка';for(let k of ['surname','initials','age','ward','bed'])el(k).value=s[k]??'';bedLimit();el('release').disabled=!s.occupied;el('restore').disabled=s.occupied||!s.lastPatient;el('error').textContent='';el('editor').showModal()}function openAdd(w){let s=slots.filter(s=>s.ward===w&&!s.occupied).sort((x,y)=>x.bed-y.bed)[0];if(!s){alert('В палате нет свободных коек');return}openEdit(s.id);el('title').textContent='Добавить пациента · Палата '+w;el('surname').focus()}function closeEditor(){el('editor').close();el('form').reset();editing=null}function vacate(s){s.lastPatient={surname:s.surname,initials:s.initials,age:s.age};Object.assign(s,{surname:'',initials:'',age:null,occupied:false})}function releaseBed(){let s=slots.find(s=>s.id===editing);if(!s?.occupied)return;if(!confirm('Освободить койку '+s.bed+' в палате '+s.ward+'?'))return;vacate(s);closeEditor();render()}function restorePatient(){let s=slots.find(s=>s.id===editing);if(!s||s.occupied||!s.lastPatient)return;if(!confirm('Вернуть '+s.lastPatient.surname+' '+s.lastPatient.initials+' на койку '+s.bed+'?'))return;Object.assign(s,s.lastPatient,{occupied:true});closeEditor();render()}
el('form').onsubmit=e=>{e.preventDefault();let source=slots.find(s=>s.id===editing),w=Number(el('ward').value),n=Number(el('bed').value),data={surname:el('surname').value.trim(),initials:el('initials').value.trim(),age:Number(el('age').value),occupied:true};const fail=m=>el('error').textContent=m;if(!data.surname||!data.initials)return fail('Заполните фамилию и инициалы.');if(!Number.isInteger(n)||n<1||n>capacities[w])return fail('Допустимый номер: от 1 до '+capacities[w]+'.');if(w===source.ward){let target=slots.find(t=>t.ward===w&&t.bed===n&&t.id!==source.id);if(target)target.bed=source.bed;source.bed=n;Object.assign(source,data)}else{let target=slots.find(t=>t.ward===w&&t.bed===n);if(!target||target.occupied)return fail('Выбранная койка занята. Выберите свободную.');if(source.occupied)vacate(source);Object.assign(target,data)}closeEditor();render()};function page(id){el('patients').hidden=id!=='patients';el('schedule').hidden=id!=='schedule';if(id==='patients')render()}
function addRow(values){let day=el('rows').rows.length+1,r=document.createElement('tr'),th=document.createElement('th');r.classList.toggle('today',day===new Date().getDate());th.scope='row';th.textContent=day;r.append(th);values.forEach((v,i)=>{let td=document.createElement('td'),s=document.createElement('select');s.setAttribute('aria-label','Число '+day+', врач группы '+(i+1));['',...doctors].forEach(d=>{let o=document.createElement('option');o.value=d;o.textContent=d||'Не назначен';s.append(o)});s.value=doctors.includes(v)?v:'';s.classList.toggle('filled',!!s.value);s.onchange=()=>{s.classList.toggle('filled',!!s.value);el('status').textContent='Есть несохранённые изменения';render()};td.append(s);r.append(td)});el('rows').append(r)}function saveSchedule(){try{localStorage.setItem('ward-schedule-doctors-roster-v1',JSON.stringify([...el('rows').rows].map(r=>[...r.querySelectorAll('select')].map(s=>s.value))));el('status').textContent='Сохранено'}catch(e){el('status').textContent='Браузер не разрешил сохранение'}}let saved;try{saved=JSON.parse(localStorage.getItem('ward-schedule-doctors-roster-v1'))}catch(e){}if(!Array.isArray(saved)||saved.length>31||!saved.every(r=>Array.isArray(r)&&r.length===2))saved=[];for(let i=0;i<31;i++)addRow(saved[i]||['','']);render();window.addEventListener('resize',fitNames);
</script></body></html>
